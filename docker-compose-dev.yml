
services:

  # ------------------------
  # 1️. Spring Boot App
  # ------------------------
  kupanga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panga-dev
    # D1 : l'application écoute sur 8089 (PORT)
    ports:
      - "8089:8089"
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev   # l'image démarre en prod par défaut (Dockerfile)
      PORT: "8089"                  # l'image écoute sur 10000 par défaut (Dockerfile) : aligné sur le port publié
      # Dans le conteneur, localhost = l'application elle-même : la base est jointe par son nom de service
      # (port interne 5432 ; .env.dev garde localhost:5433 pour lancer l'API depuis l'IDE)
      DB_URL: jdbc:postgresql://db:5432/kupanga_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Dans le conteneur, localhost = l'application elle-même : le stockage est joint par son nom de service
      STOCKAGE_ENDPOINT: http://stockage:9000
      # M1 : e-mails capturés par Mailpit (http://localhost:8025), rien n'est vraiment envoyé.
      # Pour un vrai envoi en dev : retirer ces lignes et renseigner SMTP_* dans .env.dev
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    depends_on:
      - db
      - stockage
      - redis
      - mailpit
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ------------------------
  # 2. PostgreSQL Database
  # ------------------------
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: kupanga-db-dev
    env_file:
      - .env.dev
    ports:
      - "5433:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ------------------------
  # 2b. PostgreSQL TEST Database
  # ------------------------
  db-test:
    image: postgis/postgis:15-3.4-alpine
    container_name: kupanga-db-test
    environment:
      POSTGRES_DB: kupanga_test
      POSTGRES_USER: kupanga
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5434:5432"       # ← port différent pour éviter le conflit
    tmpfs:
      - /var/lib/postgresql/data   # ← stockage en RAM, pas de volume persistant
    restart: "no"         # ← inutile de redémarrer un container de test
    profiles:
      - test              # ← démarré UNIQUEMENT avec --profile test
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kupanga -d kupanga_test" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------
  # 3️. Stockage S3 : RustFS (S3, Sprint 5)
  # ------------------------
  # MinIO n'est plus maintenu en open source : RustFS (Apache 2.0), figé par version et digest (D7).
  # Identifiants de développement seulement ; l'application parle S3 et ne dépend pas de RustFS.
  stockage:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    # Image non root (UID 10001) : root en dev pour écrire dans le volume sans étape de préparation
    user: "0:0"
    container_name: rustfs-dev
    environment:
      RUSTFS_ACCESS_KEY: kupanga-dev
      RUSTFS_SECRET_KEY: kupanga-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      # Revue S2 : identifiants de dev connus → écoute sur la machine seulement
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # console
    command: /data
    volumes:
      - stockage-data-dev:/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ------------------------
  # 3c. Mailpit : faux serveur SMTP de développement (M1)
  # ------------------------
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    container_name: mailpit-dev
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # interface web : e-mails reçus
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ------------------------
  # 4. Redis Cache
  # ------------------------
  redis:
    image: redis:7.4.6-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    restart: always
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------
  # 5️. RedisInsight GUI
  # ------------------------
  redisinsight:
    image: redis/redisinsight:2.60.0
    container_name: redisinsight-dev
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data-dev:/data   # ← persist la config RedisInsight
    depends_on:
      redis:
        condition: service_healthy    # ← attend que Redis ping réponde
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always
# ------------------------
# Volumes persistants
# ------------------------
volumes:
  db-data-dev:
  stockage-data-dev:
  redis-data-dev:
  redisinsight-data-dev:
