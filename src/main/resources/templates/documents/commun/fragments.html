<!DOCTYPE html>
<!--
  J5 : fragments communs aux modèles de documents de tous les pays.
  Styles en ligne (Flying Saucer) : ces fragments ne dépendent pas de la feuille de style du document.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Bloc de signature d'une partie. Paramètres : qualité (« Le bailleur »), nom complet, image PNG en base64
  (ou null), date et heure de la signature (ou null), date de l'acte (« Fait le »).
-->
<td th:fragment="signature(qualite, nom, image, signeLe, faitLe)">
    <div style="font-weight: bold;" th:text="${qualite}">Le bailleur</div>
    <div th:text="${nom}">Nom</div>
    <img th:if="${image != null}" class="signature-img"
         th:src="'data:image/png;base64,' + ${image}" alt="Signature"/>
    <div th:if="${image == null}" class="signature-attente">En attente de signature</div>
    <div class="mention" th:if="${signeLe != null}"
         th:text="'Signé électroniquement le ' + ${#temporals.format(signeLe, 'dd/MM/yyyy à HH:mm')}"></div>
    <div class="mention" th:if="${faitLe != null}"
         th:text="'Fait le ' + ${#temporals.format(faitLe, 'dd/MM/yyyy')}"></div>
</td>

</body>
</html>
