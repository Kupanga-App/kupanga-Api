<!DOCTYPE html>
<!--
  Styles communs aux documents de tous les pays (bail, quittance, état des lieux).
  Présentation d'acte : papier blanc, police à empattements, texte noir, tableaux à filets fins,
  articles numérotés, numérotation des pages en pied (Flying Saucer : polices PDF de base, CSS 2.1 + @page).
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style th:fragment="document">
    @page {
        size: A4;
        margin: 20mm 20mm 22mm 20mm;
        @bottom-center { content: element(pied); }
    }

    body {
        font-family: "Times New Roman", Times, serif;
        font-size: 10.5pt;
        line-height: 1.45;
        color: #000000;
        background-color: #ffffff;
        margin: 0;
    }

    /* ── Pied de page (répété sur chaque page) ── */
    .pied {
        position: running(pied);
        font-size: 8pt;
        color: #444444;
        border-top: 0.5pt solid #000000;
        padding-top: 4pt;
    }
    .pied table { width: 100%; border-collapse: collapse; }
    .pied td { padding: 0; }
    .numero-page:before { content: counter(page); }
    .total-pages:before { content: counter(pages); }

    /* ── En-tête du document ── */
    .entete { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-bottom: 18pt; }
    .entete td { padding: 0 0 4pt 0; border-bottom: 0.5pt solid #000000; vertical-align: bottom; }
    .entete .emetteur { font-variant: small-caps; letter-spacing: 0.5pt; }
    .entete .reference { text-align: right; }

    /* ── Titre ── */
    .titre-bloc { text-align: center; margin-bottom: 18pt; }
    .titre-bloc p { text-align: center; }
    .titre {
        font-size: 16pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1pt;
        margin: 0 0 4pt 0;
    }
    .sous-titre { font-size: 11pt; font-style: italic; margin: 0 0 6pt 0; }
    .cadre-legal { font-size: 9pt; margin: 0; }
    .filet-double {
        border-top: 0.5pt solid #000000;
        border-bottom: 0.5pt solid #000000;
        height: 2pt;
        margin: 10pt auto 0 auto;
        width: 40%;
    }

    /* ── Articles ── */
    .article {
        font-size: 10.5pt;
        font-weight: bold;
        text-transform: uppercase;
        margin: 16pt 0 6pt 0;
        padding-bottom: 2pt;
        border-bottom: 0.5pt solid #000000;
        page-break-after: avoid;
    }
    .sous-article {
        font-size: 10.5pt;
        font-weight: bold;
        margin: 10pt 0 4pt 0;
        page-break-after: avoid;
    }
    p { margin: 0 0 6pt 0; text-align: justify; }
    /* Aucun tableau coupé entre deux pages : le bloc passe en entier sur la page suivante.
       Un tableau plus long qu'une page (pièce d'EDL très détaillée) est coupé entre deux lignes,
       jamais au milieu d'une ligne, avec l'en-tête des colonnes répété (thead + -fs-table-paginate). */
    .indivisible { page-break-inside: avoid; }
    table { page-break-inside: avoid; }
    tr { page-break-inside: avoid; }
    thead { display: table-header-group; }
    .tableau { -fs-table-paginate: paginate; }

    /* ── Tableaux de renseignements (libellé / valeur) ── */
    .tableau { width: 100%; border-collapse: collapse; margin: 4pt 0 8pt 0; }
    .tableau td, .tableau th {
        border: 0.5pt solid #000000;
        padding: 3pt 6pt;
        vertical-align: top;
        text-align: left;
    }
    .tableau th {
        font-weight: bold;
        background-color: #eeeeee;
        font-size: 9.5pt;
    }
    .tableau .libelle { width: 40%; background-color: #f6f6f6; }
    .tableau .montant { text-align: right; white-space: nowrap; }
    .tableau .centre { text-align: center; }
    .tableau .total td { font-weight: bold; }
    .tableau .vide { text-align: center; font-style: italic; color: #444444; }

    /* ── Parties ── */
    .parties { width: 100%; border-collapse: collapse; margin: 4pt 0 8pt 0; }
    .parties td { width: 50%; border: 0.5pt solid #000000; padding: 6pt 8pt; vertical-align: top; }
    .qualite { font-weight: bold; text-transform: uppercase; font-size: 9pt; margin-bottom: 3pt; }
    .nom { font-weight: bold; }
    .ci-apres { font-style: italic; font-size: 9.5pt; margin-top: 3pt; }

    /* ── Pièces de l'état des lieux ── */
    .piece { margin-bottom: 8pt; }
    .piece-titre { font-weight: bold; margin: 8pt 0 3pt 0; page-break-after: avoid; }
    .remarque { font-size: 9.5pt; font-style: italic; margin: 2pt 0 6pt 0; }

    /* ── Signatures ── */
    .signatures { width: 100%; border-collapse: collapse; margin-top: 8pt; }
    .signatures td { width: 50%; border: 0.5pt solid #000000; padding: 6pt 8pt; vertical-align: top; height: 120pt; }
    .signature-img { width: 180px; height: 70px; margin: 4pt 0; }
    .signature-attente {
        height: 70px;
        margin: 4pt 0;
        border-bottom: 0.5pt dotted #000000;
        font-size: 8.5pt;
        font-style: italic;
        color: #444444;
    }
    .mention { font-size: 8.5pt; color: #222222; }
</style>
</head>
<body></body>
</html>
