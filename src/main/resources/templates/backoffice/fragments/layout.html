<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<!-- ═══════════════════════════════════════════════════
     Fragment : <head> commun (styles + CDNs)
     Usage    : th:replace="~{backoffice/fragments/layout :: head('Titre')}"
     ═══════════════════════════════════════════════════ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Kupanga Admin'">Kupanga Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root {
            --sidebar-w   : 240px;
            --sidebar-bg  : #1a237e;
            --sidebar-hover: rgba(255,255,255,0.08);
            --sidebar-active: rgba(255,255,255,0.18);
            --topbar-h    : 56px;
            --radius      : 12px;
            --shadow      : 0 2px 16px rgba(0,0,0,.07);
        }

        body { background: #f0f2f8; font-family: 'Segoe UI', system-ui, sans-serif; }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-w); height: 100vh;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            z-index: 1000; overflow-y: auto;
        }
        .sidebar-brand {
            padding: 1.4rem 1.2rem 1.2rem;
            color: #fff;
            font-size: 1.35rem; font-weight: 800; letter-spacing: -.5px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .sidebar-brand small {
            display: block;
            font-size: .6rem; font-weight: 400;
            color: rgba(255,255,255,.45); letter-spacing: .5px;
            text-transform: uppercase; margin-top: 2px;
        }
        .sidebar-nav { padding: .75rem .6rem; flex: 1; }
        .sidebar-nav .nav-link {
            color: rgba(255,255,255,.65);
            padding: .6rem 1rem; border-radius: 8px;
            margin-bottom: 2px; font-size: .875rem;
            display: flex; align-items: center; gap: .6rem;
            transition: background .15s, color .15s;
        }
        .sidebar-nav .nav-link:hover  { background: var(--sidebar-hover); color: #fff; }
        .sidebar-nav .nav-link.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
        .sidebar-nav .nav-link i { font-size: 1rem; width: 18px; text-align: center; }
        .sidebar-footer {
            padding: .9rem 1rem;
            border-top: 1px solid rgba(255,255,255,.1);
        }

        /* ── Main area ───────────────────────────────── */
        .main-wrapper { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Top bar ─────────────────────────────────── */
        .topbar {
            height: var(--topbar-h);
            background: #fff;
            border-bottom: 1px solid #e5e8f0;
            display: flex; align-items: center; justify-content: flex-end;
            padding: 0 1.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,.04);
            position: sticky; top: 0; z-index: 100;
        }

        /* ── Cards ───────────────────────────────────── */
        .stat-card {
            border: none; border-radius: var(--radius);
            box-shadow: var(--shadow); background: #fff;
        }
        .stat-icon {
            width: 48px; height: 48px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }

        /* ── Tables ──────────────────────────────────── */
        .content-card {
            border: none; border-radius: var(--radius);
            box-shadow: var(--shadow); background: #fff;
        }
        .content-card .card-header {
            background: #fff; border-bottom: 1px solid #f0f2f8;
            border-radius: var(--radius) var(--radius) 0 0 !important;
            padding: 1rem 1.25rem; font-weight: 600;
        }
        .table { margin-bottom: 0; font-size: .875rem; }
        .table thead th {
            background: #f8f9fc; border-bottom: 2px solid #e8eaf6;
            font-weight: 600; color: #5c6784; font-size: .8rem;
            text-transform: uppercase; letter-spacing: .4px;
        }
        .table tbody tr:hover { background: #f8f9ff; }

        /* ── Pagination ──────────────────────────────── */
        .pagination .page-link {
            border: none; border-radius: 8px !important;
            margin: 0 2px; color: #1a237e; font-size: .85rem;
            padding: .4rem .75rem;
        }
        .pagination .page-link:hover { background: #e8eaf6; }
        .pagination .page-item.active .page-link { background: #1a237e; color: #fff; }
        .pagination .page-item.disabled .page-link { color: #adb5bd; }

        /* ── Badges rôles ────────────────────────────── */
        .badge-locataire   { background: #e8f5e9; color: #2e7d32; }
        .badge-proprietaire{ background: #e3f2fd; color: #1565c0; }
        .badge-admin       { background: #fce4ec; color: #c62828; }

        /* ── Search form ─────────────────────────────── */
        .search-card {
            border: none; border-radius: var(--radius);
            box-shadow: var(--shadow); background: #fff;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }
        .form-control, .form-select {
            border-radius: 8px; font-size: .875rem;
            border-color: #e0e3ef;
        }
        .form-control:focus, .form-select:focus {
            border-color: #7986cb; box-shadow: 0 0 0 .2rem rgba(121,134,203,.2);
        }
        .btn-search { background: #1a237e; color: #fff; border-radius: 8px; }
        .btn-search:hover { background: #283593; color: #fff; }
        .btn-reset  { border-radius: 8px; }
    </style>
</head>

<!-- ═══════════════════════════════════════════════════
     Fragment : sidebar
     Usage    : th:replace="~{backoffice/fragments/layout :: sidebar('dashboard')}"
     ═══════════════════════════════════════════════════ -->
<div th:fragment="sidebar(active)">
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-buildings me-2"></i>Kupanga
            <small>Administration</small>
        </div>

        <nav class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active'"
                       th:href="@{/backoffice/dashboard}">
                        <i class="bi bi-speedometer2"></i>Tableau de bord
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'users'} ? ' active'"
                       th:href="@{/backoffice/users}">
                        <i class="bi bi-people"></i>Utilisateurs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'biens'} ? ' active'"
                       th:href="@{/backoffice/biens}">
                        <i class="bi bi-house"></i>Biens
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/backoffice/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light w-100">
                    <i class="bi bi-box-arrow-left me-1"></i>Déconnexion
                </button>
            </form>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════
     Fragment : topbar
     Usage    : th:replace="~{backoffice/fragments/layout :: topbar}"
     ═══════════════════════════════════════════════════ -->
<div th:fragment="topbar">
    <div class="topbar">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center"
                 style="width:32px;height:32px;">
                <i class="bi bi-shield-lock text-primary" style="font-size:.9rem;"></i>
            </div>
            <span class="text-muted small" th:text="${adminEmail}">admin</span>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════
     Fragment : scripts Bootstrap (en bas de body)
     ═══════════════════════════════════════════════════ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
