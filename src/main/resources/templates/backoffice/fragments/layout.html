<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<!-- ═══════════════════════════════════════════════════
     Fragment : <head> commun
     Usage    : th:replace="~{backoffice/fragments/layout :: head('Titre')}"
     Même système visuel que le front (jetons --kp-*, Figtree) : /backoffice/assets/backoffice.css
     Aucune ressource tierce : police, icônes et scripts servis par l'API (GET /backoffice/assets/**)
     ═══════════════════════════════════════════════════ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <title th:text="${title} + ' · Kupanga Admin'">Kupanga Admin</title>
    <!-- Thème choisi (sinon celui de l'appareil), appliqué avant le premier rendu -->
    <script>
        try {
            var t = localStorage.getItem('kupanga-admin-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* stockage indisponible : thème de l'appareil */ }
    </script>
    <link rel="icon" type="image/svg+xml" th:href="@{/backoffice/assets/icone.svg}"/>
    <link rel="preload" th:href="@{/backoffice/assets/polices/figtree-latin-400.woff2}" as="font" type="font/woff2" crossorigin=""/>
    <link rel="stylesheet" th:href="@{/backoffice/assets/backoffice.css}"/>
</head>

<!-- ═══════════════════════════════════════════════════
     Fragment : barre latérale (ordinateur) / menu (téléphone)
     Usage    : th:replace="~{backoffice/fragments/layout :: sidebar('dashboard')}"
     ═══════════════════════════════════════════════════ -->
<aside th:fragment="sidebar(active)" class="kp-sidebar" id="kp-menu" aria-label="Menu du back-office">
    <a class="kp-sidebar__logo" th:href="@{/backoffice/dashboard}" aria-label="Kupanga, tableau de bord">
        <img class="kp-logo--clair" th:src="@{/backoffice/assets/logo-clair.svg}" alt=""/>
        <img class="kp-logo--sombre" th:src="@{/backoffice/assets/logo-sombre.svg}" alt=""/>
    </a>
    <div class="kp-sidebar__role">Administration</div>

    <nav class="kp-sidebar__nav" aria-label="Navigation principale">
        <a class="kp-entree" th:href="@{/backoffice/dashboard}" th:attr="aria-current=${active == 'dashboard'} ? 'page'">
            <i data-lucide="layout-dashboard" aria-hidden="true"></i><span class="kp-entree__libelle">Tableau de bord</span>
        </a>
        <a class="kp-entree" th:href="@{/backoffice/analytics}" th:attr="aria-current=${active == 'analytics'} ? 'page'">
            <i data-lucide="chart-column" aria-hidden="true"></i><span class="kp-entree__libelle">Analytiques</span>
        </a>
        <div class="kp-sidebar__section">Gestion</div>
        <a class="kp-entree" th:href="@{/backoffice/users}" th:attr="aria-current=${active == 'users'} ? 'page'">
            <i data-lucide="users" aria-hidden="true"></i><span class="kp-entree__libelle">Utilisateurs</span>
        </a>
        <a class="kp-entree" th:href="@{/backoffice/biens}" th:attr="aria-current=${active == 'biens'} ? 'page'">
            <i data-lucide="building-2" aria-hidden="true"></i><span class="kp-entree__libelle">Biens</span>
        </a>
        <a class="kp-entree" th:href="@{/backoffice/emails}" th:attr="aria-current=${active == 'emails'} ? 'page'">
            <i data-lucide="mail" aria-hidden="true"></i><span class="kp-entree__libelle">E-mails</span>
        </a>
    </nav>

    <div class="kp-sidebar__bas">
        <div class="kp-compte">
            <span class="kp-compte__avatar" aria-hidden="true"><i data-lucide="shield-check"></i></span>
            <span class="kp-compte__texte">
                <span class="kp-compte__nom" style="display:block">Administrateur</span>
                <span class="kp-compte__email kp-ellipsis" style="display:block" th:text="${adminEmail}">admin</span>
            </span>
            <button type="button" class="kp-icone-btn kp-theme" data-kp-theme aria-label="Changer de thème" title="Thème clair ou sombre">
                <i data-lucide="moon" class="kp-theme__lune" aria-hidden="true"></i>
                <i data-lucide="sun" class="kp-theme__soleil" aria-hidden="true"></i>
            </button>
        </div>
        <form th:action="@{/backoffice/logout}" method="post">
            <button type="submit" class="kp-btn kp-btn--bloc">
                <i data-lucide="log-out" aria-hidden="true"></i>Se déconnecter
            </button>
        </form>
    </div>
</aside>

<!-- ═══════════════════════════════════════════════════
     Fragment : barre du haut (téléphone et tablette : logo + bouton du menu)
     Usage    : th:replace="~{backoffice/fragments/layout :: topbar}"
     ═══════════════════════════════════════════════════ -->
<div th:fragment="topbar" th:remove="tag">
    <div class="kp-topbar">
        <a th:href="@{/backoffice/dashboard}" aria-label="Kupanga, tableau de bord">
            <img class="kp-logo--clair" th:src="@{/backoffice/assets/logo-clair.svg}" alt=""/>
            <img class="kp-logo--sombre" th:src="@{/backoffice/assets/logo-sombre.svg}" alt=""/>
        </a>
        <button type="button" class="kp-icone-btn" data-kp-menu aria-controls="kp-menu" aria-expanded="false" aria-label="Ouvrir le menu">
            <i data-lucide="menu" aria-hidden="true"></i>
        </button>
    </div>
    <div class="kp-voile" data-kp-menu-fermer></div>
</div>

<!-- ═══════════════════════════════════════════════════
     Fragment : pastille d'évolution sur 30 jours (Indicateur du tableau de bord)
     Usage    : th:replace="~{backoffice/fragments/layout :: delta(${indicateur})}"
     ═══════════════════════════════════════════════════ -->
<th:block th:fragment="delta(ind)">
    <span th:if="${ind.variation() != null}" class="kp-delta"
          th:classappend="${ind.variation() > 0} ? 'kp-delta--hausse' : (${ind.variation() < 0} ? 'kp-delta--baisse' : '')"
          th:attr="aria-label=${ind.variation() > 0 ? 'en hausse de ' : (ind.variation() < 0 ? 'en baisse de ' : 'stable, ')} + ${ind.variation() < 0 ? -ind.variation() : ind.variation()} + ' % par rapport aux 30 jours précédents'">
        <i th:attr="data-lucide=${ind.variation() > 0 ? 'trending-up' : (ind.variation() < 0 ? 'trending-down' : 'minus')}" aria-hidden="true"></i>
        <span th:text="(${ind.variation() > 0} ? '+' : '') + ${ind.variation()} + ' %'">+0 %</span>
    </span>
    <span th:if="${ind.variation() == null and ind.nouveaux > 0}" class="kp-delta kp-delta--hausse">Nouveau</span>
</th:block>


<!-- ═══════════════════════════════════════════════════
     Fragment : pagination (pages voisines, première et dernière)
     Usage    : <nav th:replace="~{backoffice/fragments/layout :: pagination(${page}, @{/backoffice/users(size=${size})})}"></nav>
     page : DTO avec pageActuelle, totalPages, totalElements ; base : URL avec les filtres, sans « page »
     ═══════════════════════════════════════════════════ -->
<div th:fragment="pagination(p, base)" class="kp-card__pied" th:if="${p.totalPages > 1}"
     th:with="sep=${#strings.contains(base, '?')} ? '&amp;' : '?'">
    <span class="kp-mention" th:text="'Page ' + ${p.pageActuelle + 1} + ' sur ' + ${p.totalPages} + ' · ' + ${p.totalElements} + ' résultats'">Page 1 sur 1</span>
    <nav aria-label="Pagination">
        <ul class="kp-pagination">
            <li>
                <a th:if="${p.pageActuelle > 0}" th:href="${base + sep + 'page=' + (p.pageActuelle - 1)}" aria-label="Page précédente">
                    <i data-lucide="chevron-left" aria-hidden="true"></i></a>
                <span th:unless="${p.pageActuelle > 0}" class="kp-desactive" aria-hidden="true"><i data-lucide="chevron-left"></i></span>
            </li>
            <li th:each="i : ${#numbers.sequence(0, p.totalPages - 1)}"
                th:if="${i == 0 or i == p.totalPages - 1 or (i >= p.pageActuelle - 2 and i <= p.pageActuelle + 2)}">
                <span th:if="${i == p.totalPages - 1 and p.pageActuelle + 3 < p.totalPages - 1}" class="kp-desactive" aria-hidden="true">…</span>
                <a th:href="${base + sep + 'page=' + i}" th:text="${i + 1}"
                   th:attr="aria-current=${i == p.pageActuelle} ? 'page'">1</a>
                <span th:if="${i == 0 and p.pageActuelle - 3 > 0}" class="kp-desactive" aria-hidden="true">…</span>
            </li>
            <li>
                <a th:if="${p.pageActuelle < p.totalPages - 1}" th:href="${base + sep + 'page=' + (p.pageActuelle + 1)}" aria-label="Page suivante">
                    <i data-lucide="chevron-right" aria-hidden="true"></i></a>
                <span th:unless="${p.pageActuelle < p.totalPages - 1}" class="kp-desactive" aria-hidden="true"><i data-lucide="chevron-right"></i></span>
            </li>
        </ul>
    </nav>
</div>

<!-- ═══════════════════════════════════════════════════
     Fragment : scripts (bas de body)
     ═══════════════════════════════════════════════════ -->
<div th:fragment="scripts" th:remove="tag">
    <!-- Aucun script tiers : Lucide 0.460.0 (licence ISC) est servi par l'API -->
    <script th:src="@{/backoffice/assets/lucide-0.460.0.min.js}"></script>
    <script th:src="@{/backoffice/assets/backoffice.js}"></script>
</div>

</html>
