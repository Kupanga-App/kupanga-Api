<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{backoffice/fragments/layout :: head('Tableau de bord')}"></head>
<body>

<div th:replace="~{backoffice/fragments/layout :: sidebar('dashboard')}"></div>

<div class="main-wrapper">

    <div th:replace="~{backoffice/fragments/layout :: topbar}"></div>

    <div class="container-fluid px-4 py-4">

        <!-- En-tête page -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h5 class="mb-0">Tableau de bord</h5>
                <p class="text-muted small mb-0">Vue d'ensemble de la plateforme</p>
            </div>
        </div>

        <!-- ── Stat cards ──────────────────────────── -->
        <div class="row g-3 mb-4">

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="users" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Total Utilisateurs</div>
                            <div class="stat-value" th:text="${totalUsers}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="user-check" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Locataires</div>
                            <div class="stat-value" th:text="${totalLocataires}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="briefcase" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Propriétaires</div>
                            <div class="stat-value" th:text="${totalProprietaires}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-6">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="building-2" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Total Biens</div>
                            <div class="stat-value" th:text="${totalBiens}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-6">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="map-pin" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Villes couvertes</div>
                            <div class="stat-value" th:text="${totalVilles}">0</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ── Tables reporting ────────────────────── -->
        <div class="row g-3">

            <!-- Biens par ville -->
            <div class="col-lg-7">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="map-pin" aria-hidden="true"></i>
                        Répartition par ville
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Ville</th>
                                        <th class="text-end">Biens</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="entry, stat : ${biensParVille}">
                                        <td class="text-muted small" th:text="${stat.count}"></td>
                                        <td class="fw-medium" th:text="${entry.key}"></td>
                                        <td class="text-end">
                                            <span class="badge-count" th:text="${entry.value}"></span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#maps.isEmpty(biensParVille)}">
                                        <td colspan="3" class="text-center text-muted py-5">
                                            <i data-lucide="inbox" style="width:32px;height:32px;display:block;margin:0 auto 0.5rem;" aria-hidden="true"></i>
                                            Aucune donnée
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Biens par type -->
            <div class="col-lg-5">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="layout-grid" aria-hidden="true"></i>
                        Répartition par type
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th class="text-end">Biens</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="entry : ${biensParType}">
                                        <td>
                                            <span class="badge-count-alt" th:text="${entry.key}"></span>
                                        </td>
                                        <td class="text-end">
                                            <span class="badge-count" th:text="${entry.value}"></span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#maps.isEmpty(biensParType)}">
                                        <td colspan="2" class="text-center text-muted py-5">
                                            <i data-lucide="inbox" style="width:32px;height:32px;display:block;margin:0 auto 0.5rem;" aria-hidden="true"></i>
                                            Aucune donnée
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<div th:replace="~{backoffice/fragments/layout :: scripts}"></div>
</body>
</html>
