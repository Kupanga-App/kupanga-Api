<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{backoffice/fragments/layout :: head('Analytiques')}"></head>
<body>

<div th:replace="~{backoffice/fragments/layout :: sidebar('analytics')}"></div>

<div class="main-wrapper">

    <div th:replace="~{backoffice/fragments/layout :: topbar}"></div>

    <div class="container-fluid px-4 py-4">

        <!-- En-tête page -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h5 class="mb-0">Analytiques</h5>
                <p class="text-muted small mb-0">Vue graphique de la plateforme</p>
            </div>
            <a th:href="@{/backoffice/dashboard}"
               class="btn btn-outline-light d-inline-flex align-items-center gap-2"
               style="font-size:0.82rem;">
                <i data-lucide="layout-dashboard" style="width:15px;height:15px;" aria-hidden="true"></i>
                Tableau de bord
            </a>
        </div>

        <!-- ── Stat cards ──────────────────────────── -->
        <div class="row g-3 mb-4">

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="users" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Total Utilisateurs</div>
                            <div class="stat-value" th:text="${totalUsers}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="building-2" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Total Biens</div>
                            <div class="stat-value" th:text="${totalBiens}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon">
                            <i data-lucide="map-pin" aria-hidden="true"></i>
                        </div>
                        <div>
                            <div class="stat-label">Villes couvertes</div>
                            <div class="stat-value" th:text="${totalVilles}">0</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ── Ligne 1 : Utilisateurs + Biens par ville ── -->
        <div class="row g-3 mb-3">

            <!-- Donut : répartition utilisateurs -->
            <div class="col-lg-5">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="users" aria-hidden="true"></i>
                        Répartition des utilisateurs
                    </div>
                    <div class="card-body d-flex flex-column align-items-center justify-content-center gap-3"
                         style="min-height:300px;">
                        <div style="position:relative;width:220px;height:220px;">
                            <canvas id="chartUsers"></canvas>
                            <div id="chartUsersCenter"
                                 style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                                        text-align:center;pointer-events:none;">
                                <div style="font-family:'DM Mono',monospace;font-size:1.6rem;font-weight:500;
                                            color:var(--mint);line-height:1;"
                                     th:text="${totalUsers}">0</div>
                                <div style="font-size:0.7rem;color:var(--mint-55);margin-top:2px;">total</div>
                            </div>
                        </div>
                        <!-- Légende manuelle -->
                        <div class="d-flex gap-3 flex-wrap justify-content-center" id="legendUsers"></div>
                    </div>
                </div>
            </div>

            <!-- Bar : biens par ville -->
            <div class="col-lg-7">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="map-pin" aria-hidden="true"></i>
                        Biens par ville
                    </div>
                    <div class="card-body d-flex align-items-center" style="min-height:300px;">
                        <canvas id="chartVilles" style="width:100%;"></canvas>
                    </div>
                </div>
            </div>

        </div>

        <!-- ── Ligne 2 : Biens par type ──────────────── -->
        <div class="row g-3">

            <!-- Donut : répartition par type -->
            <div class="col-lg-5">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="layout-grid" aria-hidden="true"></i>
                        Répartition par type de bien
                    </div>
                    <div class="card-body d-flex flex-column align-items-center justify-content-center gap-3"
                         style="min-height:280px;">
                        <div style="position:relative;width:200px;height:200px;">
                            <canvas id="chartTypes"></canvas>
                            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                                        text-align:center;pointer-events:none;">
                                <div style="font-family:'DM Mono',monospace;font-size:1.6rem;font-weight:500;
                                            color:var(--mint);line-height:1;"
                                     th:text="${totalBiens}">0</div>
                                <div style="font-size:0.7rem;color:var(--mint-55);margin-top:2px;">biens</div>
                            </div>
                        </div>
                        <div class="d-flex gap-3 flex-wrap justify-content-center" id="legendTypes"></div>
                    </div>
                </div>
            </div>

            <!-- Résumé textuel -->
            <div class="col-lg-7">
                <div class="card content-card h-100">
                    <div class="card-header">
                        <i data-lucide="bar-chart-2" aria-hidden="true"></i>
                        Résumé des indicateurs
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Indicateur</th>
                                    <th class="text-end">Valeur</th>
                                    <th class="text-end">Part</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <span class="d-inline-flex align-items-center gap-2">
                                            <span style="width:10px;height:10px;border-radius:50%;
                                                         background:#8FA464;display:inline-block;flex-shrink:0;"></span>
                                            Locataires
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <span class="badge-count" th:text="${totalLocataires}"></span>
                                    </td>
                                    <td class="text-end text-muted small" id="pctLocataires">—</td>
                                </tr>
                                <tr>
                                    <td>
                                        <span class="d-inline-flex align-items-center gap-2">
                                            <span style="width:10px;height:10px;border-radius:50%;
                                                         background:#5A8FAF;display:inline-block;flex-shrink:0;"></span>
                                            Propriétaires
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <span class="badge-count" th:text="${totalProprietaires}"></span>
                                    </td>
                                    <td class="text-end text-muted small" id="pctProprietaires">—</td>
                                </tr>
                                <tr th:each="entry : ${biensParType}">
                                    <td>
                                        <span class="d-inline-flex align-items-center gap-2">
                                            <span class="type-dot" th:attr="data-type=${entry.key}"
                                                  style="width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;"></span>
                                            <span th:text="${entry.key}"></span>
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <span class="badge-count" th:text="${entry.value}"></span>
                                    </td>
                                    <td class="text-end text-muted small"
                                        th:text="${totalBiens > 0}
                                            ? ${#numbers.formatDecimal(entry.value * 100.0 / totalBiens, 1, 1)} + ' %'
                                            : '—'">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<div th:replace="~{backoffice/fragments/layout :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
/*<![CDATA[*/
(function () {

    /* ── Données injectées par Thymeleaf ── */
    const totalLocataires    = /*[[${totalLocataires}]]*/ 0;
    const totalProprietaires = /*[[${totalProprietaires}]]*/ 0;
    const totalUsers         = /*[[${totalUsers}]]*/ 0;
    const biensParVille      = /*[[${biensParVille}]]*/ {};
    const biensParType       = /*[[${biensParType}]]*/ {};

    const totalAdmins = Math.max(0, totalUsers - totalLocataires - totalProprietaires);

    /* ── Palette cohérente avec le design system ── */
    const COLORS = {
        olive:   { bg: 'rgba(143,164,100,0.75)', border: '#8FA464' },
        info:    { bg: 'rgba(90,143,175,0.75)',  border: '#5A8FAF' },
        warning: { bg: 'rgba(212,168,83,0.75)',  border: '#D4A853' },
        danger:  { bg: 'rgba(192,97,74,0.75)',   border: '#C0614A' },
        muted:   { bg: 'rgba(239,251,219,0.18)', border: 'rgba(239,251,219,0.35)' },
    };

    const TYPE_COLORS = {
        'APPARTEMENT': COLORS.info,
        'MAISON':      COLORS.olive,
        'STUDIO':      COLORS.warning,
    };

    /* ── Defaults Chart.js ── */
    Chart.defaults.color            = 'rgba(239,251,219,0.55)';
    Chart.defaults.borderColor      = 'rgba(143,164,100,0.15)';
    Chart.defaults.font.family      = "'DM Sans', system-ui, sans-serif";
    Chart.defaults.font.size        = 12;

    /* ── Helpers ── */
    function pct(val, total) {
        if (!total) return '0 %';
        return (val * 100 / total).toFixed(1) + ' %';
    }

    function buildLegend(containerId, labels, colors) {
        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = labels.map((lbl, i) =>
            `<span style="display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;
                          color:rgba(239,251,219,0.7);">
                <span style="width:10px;height:10px;border-radius:50%;
                             background:${colors[i]};flex-shrink:0;display:inline-block;"></span>
                ${lbl}
            </span>`
        ).join('');
    }

    /* ══════════════════════════════════════════
       Chart 1 — Répartition des utilisateurs
       ══════════════════════════════════════════ */
    const usersLabels = ['Locataires', 'Propriétaires'];
    const usersData   = [totalLocataires, totalProprietaires];
    const usersBg     = [COLORS.olive.bg, COLORS.info.bg];
    const usersBorder = [COLORS.olive.border, COLORS.info.border];

    if (totalAdmins > 0) {
        usersLabels.push('Admins');
        usersData.push(totalAdmins);
        usersBg.push(COLORS.danger.bg);
        usersBorder.push(COLORS.danger.border);
    }

    new Chart(document.getElementById('chartUsers'), {
        type: 'doughnut',
        data: {
            labels: usersLabels,
            datasets: [{
                data: usersData,
                backgroundColor: usersBg,
                borderColor: usersBorder,
                borderWidth: 1.5,
                hoverOffset: 6,
            }]
        },
        options: {
            cutout: '68%',
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.label}: ${ctx.raw} (${pct(ctx.raw, totalUsers)})`
                    }
                }
            }
        }
    });

    buildLegend('legendUsers', usersLabels, usersBg);

    /* ── Pourcentages dans le tableau récap ── */
    const elPctLoc  = document.getElementById('pctLocataires');
    const elPctProp = document.getElementById('pctProprietaires');
    if (elPctLoc)  elPctLoc.textContent  = pct(totalLocataires, totalUsers);
    if (elPctProp) elPctProp.textContent = pct(totalProprietaires, totalUsers);

    /* ══════════════════════════════════════════
       Chart 2 — Biens par ville (barres horizontales)
       ══════════════════════════════════════════ */
    const villeLabels = Object.keys(biensParVille);
    const villeData   = Object.values(biensParVille);

    new Chart(document.getElementById('chartVilles'), {
        type: 'bar',
        data: {
            labels: villeLabels,
            datasets: [{
                label: 'Biens',
                data: villeData,
                backgroundColor: COLORS.olive.bg,
                borderColor: COLORS.olive.border,
                borderWidth: 1.5,
                borderRadius: 6,
                borderSkipped: false,
            }]
        },
        options: {
            indexAxis: 'y',
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.raw} bien(s)`
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: 'rgba(143,164,100,0.10)' },
                    ticks: { precision: 0 }
                },
                y: {
                    grid: { display: false },
                }
            }
        }
    });

    /* ══════════════════════════════════════════
       Chart 3 — Répartition par type de bien
       ══════════════════════════════════════════ */
    const typeLabels = Object.keys(biensParType);
    const typeData   = Object.values(biensParType);
    const typeBg     = typeLabels.map(t => (TYPE_COLORS[t] || COLORS.muted).bg);
    const typeBorder = typeLabels.map(t => (TYPE_COLORS[t] || COLORS.muted).border);

    new Chart(document.getElementById('chartTypes'), {
        type: 'doughnut',
        data: {
            labels: typeLabels,
            datasets: [{
                data: typeData,
                backgroundColor: typeBg,
                borderColor: typeBorder,
                borderWidth: 1.5,
                hoverOffset: 6,
            }]
        },
        options: {
            cutout: '65%',
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.label}: ${ctx.raw} bien(s)`
                    }
                }
            }
        }
    });

    buildLegend('legendTypes', typeLabels, typeBg);

    /* ── Couleurs des points dans le tableau récap ── */
    document.querySelectorAll('.type-dot').forEach(dot => {
        const c = TYPE_COLORS[dot.dataset.type] || COLORS.muted;
        dot.style.background = c.border;
    });

})();
/*]]>*/
</script>

</body>
</html>
