<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Connexion — Kupanga Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=DM+Sans:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --night:       #10212B;
            --night-mid:   #1E3545;
            --olive:       #8FA464;
            --olive-light: #B5CA8D;
            --olive-dark:  #6B7C4B;
            --mint:        #EFFBDB;
            --mint-80:     rgba(239,251,219,0.80);
            --mint-55:     rgba(239,251,219,0.55);
            --olive-10:    rgba(143,164,100,0.10);
            --olive-15:    rgba(143,164,100,0.15);
            --olive-25:    rgba(143,164,100,0.25);
            --danger:      #C0614A;
        }
        body {
            min-height: 100vh;
            background: var(--night);
            display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', system-ui, sans-serif;
            color: var(--mint-80);
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 25%, rgba(143,164,100,0.10) 0%, transparent 65%);
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%; max-width: 420px;
            padding: 1.5rem;
            position: relative; z-index: 1;
        }
        .login-card {
            background: var(--night-mid);
            border: 1px solid var(--olive-15);
            border-radius: 16px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.5);
            padding: 2.5rem 2rem;
        }

        /* Brand */
        .brand-icon {
            width: 56px; height: 56px; border-radius: 14px;
            background: var(--olive-10);
            border: 1px solid var(--olive-25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .brand-icon .lucide { width: 28px; height: 28px; color: var(--olive); stroke-width: 1.5; }
        .brand-name {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 1.9rem; font-weight: 400;
            color: var(--mint); text-align: center; line-height: 1.1;
        }
        .brand-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem; font-weight: 400;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: var(--mint-55); text-align: center;
            margin-top: 0.4rem; margin-bottom: 2rem;
        }

        /* Alertes */
        .alert-ds {
            border-radius: 8px; font-size: 0.85rem;
            display: flex; align-items: flex-start; gap: 0.6rem;
            padding: 0.75rem 1rem; margin-bottom: 1.25rem;
            border: 1px solid;
            line-height: 1.4;
        }
        .alert-ds .lucide { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 1.5; margin-top: 1px; }
        .alert-danger-ds {
            background: rgba(192,97,74,0.12);
            border-color: rgba(192,97,74,0.30);
            color: #e07d6a;
        }
        .alert-success-ds {
            background: rgba(143,164,100,0.12);
            border-color: var(--olive-25);
            color: var(--olive-light);
        }

        /* Formulaire */
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: 0.82rem; font-weight: 500;
            color: var(--mint); margin-bottom: 0.4rem;
        }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; left: 0.9rem; top: 50%;
            transform: translateY(-50%);
            color: var(--mint-55); pointer-events: none;
        }
        .input-icon .lucide { width: 16px; height: 16px; stroke-width: 1.5; }
        .form-input {
            width: 100%;
            background: var(--night);
            border: 1px solid rgba(143,164,100,0.20);
            color: var(--mint);
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.9rem;
            padding: 0.65rem 1rem 0.65rem 2.75rem;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: var(--mint-55); }
        .form-input:focus {
            border-color: var(--olive);
            box-shadow: 0 0 0 3px rgba(143,164,100,0.25);
        }

        /* Bouton */
        .btn-login {
            width: 100%;
            background: var(--olive); color: var(--night);
            border: none;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.85rem; font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-login:hover  { background: var(--olive-light); }
        .btn-login:active { background: var(--olive-dark); color: var(--mint); }
        .btn-login .lucide { width: 16px; height: 16px; stroke-width: 1.5; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Brand -->
        <div class="brand-icon">
            <i data-lucide="home" aria-hidden="true"></i>
        </div>
        <div class="brand-name">Kupanga</div>
        <div class="brand-sub">Back-Office Administration</div>

        <!-- Alertes -->
        <div th:if="${param.error}" class="alert-ds alert-danger-ds" role="alert">
            <i data-lucide="alert-triangle" aria-hidden="true"></i>
            <span>Identifiants incorrects. Veuillez réessayer.</span>
        </div>
        <div th:if="${param.logout}" class="alert-ds alert-success-ds" role="alert">
            <i data-lucide="check-circle" aria-hidden="true"></i>
            <span>Vous avez été déconnecté avec succès.</span>
        </div>

        <!-- Formulaire -->
        <form th:action="@{/backoffice/login}" method="post">

            <div class="form-group">
                <label for="username" class="form-label">Adresse email</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i data-lucide="mail" aria-hidden="true"></i></span>
                    <input type="text" id="username" name="username"
                           class="form-input" placeholder="admin@example.com"
                           autocomplete="username" required/>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i data-lucide="lock" aria-hidden="true"></i></span>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="••••••••"
                           autocomplete="current-password" required/>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i data-lucide="log-in" aria-hidden="true"></i>
                Se connecter
            </button>
        </form>

    </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
