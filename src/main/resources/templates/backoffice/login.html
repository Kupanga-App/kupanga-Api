<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Connexion — Kupanga Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #3949ab 60%, #5c6bc0 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-wrapper { width: 100%; max-width: 420px; padding: 1rem; }
        .login-card {
            border: none; border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,.35);
        }
        .brand { font-size: 2rem; font-weight: 800; letter-spacing: -1px; color: #1a237e; }
        .brand-sub { font-size: .75rem; text-transform: uppercase; letter-spacing: 2px; color: #9fa8da; }
        .form-control {
            border-radius: 10px; border-color: #e0e3ef; padding: .7rem 1rem;
            font-size: .9rem;
        }
        .form-control:focus { border-color: #7986cb; box-shadow: 0 0 0 .2rem rgba(121,134,203,.2); }
        .input-group-text { border-radius: 10px 0 0 10px !important; border-color: #e0e3ef; background: #f8f9fc; }
        .btn-login {
            background: #1a237e; color: #fff; border: none;
            border-radius: 10px; padding: .75rem; font-weight: 600;
            letter-spacing: .3px; transition: background .2s;
        }
        .btn-login:hover { background: #283593; color: #fff; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">

            <!-- Brand -->
            <div class="text-center mb-4">
                <div class="brand"><i class="bi bi-buildings me-1"></i>Kupanga</div>
                <div class="brand-sub mt-1">Back-Office Administration</div>
            </div>

            <!-- Alertes -->
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Identifiants incorrects. Veuillez réessayer.</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Vous avez été déconnecté avec succès.</span>
            </div>

            <!-- Formulaire -->
            <form th:action="@{/backoffice/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small">Adresse email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="text" id="username" name="username"
                               class="form-control" placeholder="admin@example.com"
                               autocomplete="username" required/>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="••••••••"
                               autocomplete="current-password" required/>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
