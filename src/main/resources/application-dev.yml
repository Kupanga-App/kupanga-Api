spring:
  config:
    import: optional:file:.env.dev
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gère le schéma, Hibernate vérifie seulement
    show-sql: true
  flyway:
    enabled: true
    # db/seed-dev : données de développement (R__donnees_de_dev.sql), jouées seulement sur une base vide.
    # Sans elles : SPRING_FLYWAY_LOCATIONS=classpath:db/migration
    locations: classpath:db/migration,classpath:db/seed-dev
    baseline-on-migrate: true   # indispensable si la BD existe déjà
    validate-on-migrate: false  # évite les conflits de checksum avec PostGIS
    default-schema: public

  # ------------------------
  # Redis Cache
  # ------------------------
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

  # M1 : par défaut, Mailpit local (docker-compose-dev.yml, http://localhost:8025) ; vrai serveur : SMTP_* dans .env.dev
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}

email:
  expediteur: ${EMAIL_EXPEDITEUR:noreply@kupanga.test}
stockage:
  endpoint: ${STOCKAGE_ENDPOINT:http://localhost:9000}
  url-publique: ${STOCKAGE_URL_PUBLIQUE:http://localhost:9000}
  access-key: ${STOCKAGE_ACCESS_KEY:kupanga-dev}
  secret-key: ${STOCKAGE_SECRET_KEY:kupanga-dev-secret}

app:
  url: http://localhost:4200/
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  reset-link: http://localhost:4200/auth/reset-password?token=
  url-login: http://localhost:4200/auth/login
  cookie:
    secure: false
    same-site: Lax