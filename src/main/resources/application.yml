spring:
  application:
    name: kupanga
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env.dev[.properties]
  # B3 : photos de smartphone (3 à 8 Mo) ; toutes les photos d'un bien partent dans une seule requête
  # (décision 2026-10-08). En prod, le reverse proxy doit accepter au moins max-request-size.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      # Analyse du corps à la lecture des @RequestPart : le 413 passe par l'API (ApiErrorResponse),
      # les routes non multipart n'analysent rien, et les intercepteurs (limite d'inscription) passent avant.
      resolve-lazily: true
  # M1 : e-mails par n'importe quel serveur SMTP, réglé par les variables SMTP_* (Brevo : smtp-relay.brevo.com:587,
  # identifiant et clé SMTP du compte ; Scaleway, Mailjet, SES, boîte du nom de domaine…). Port 587 + STARTTLS par
  # défaut ; port 465 : SMTP_SSL=true et SMTP_STARTTLS=false.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000

server:
  port: ${PORT:8089}
  # R1 : réponses texte compressées en gzip (réseau mobile lent et cher au Congo) ; les photos et PDF, déjà
  # compressés, ne le sont pas
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,text/plain,application/javascript
    min-response-size: 1KB

# D2 : /actuator/health/liveness (HEALTHCHECK du Dockerfile) et /readiness, sans détails
management:
  endpoint:
    health:
      probes:
        enabled: true
  # M1 : une panne du serveur SMTP ne rend pas l'application « DOWN » (les e-mails sont réessayés)
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


# M1 / S1 : sections à la racine, hors de « kupanga » : JuridictionProperties lie tout le préfixe « kupanga »
# en refusant les clés inconnues (J2)
# M1 : identité de l'expéditeur, sur un domaine à soi (SPF, DKIM, DMARC autorisant le serveur SMTP)
email:
  expediteur: ${EMAIL_EXPEDITEUR:noreply@kupanga.test}
  nom-expediteur: ${EMAIL_NOM_EXPEDITEUR:Kupanga}
  repondre-a: ${EMAIL_REPONDRE_A:}
# S1 : stockage S3 indépendant du serveur (RustFS, Garage, MinIO, S3 managé), réglé par les variables STOCKAGE_*
stockage:
  endpoint: ${STOCKAGE_ENDPOINT:http://localhost:9000}         # vu par l'application (réseau interne)
  url-publique: ${STOCKAGE_URL_PUBLIQUE:http://localhost:9000} # vu par le navigateur (photos, URL présignées)
  region: ${STOCKAGE_REGION:us-east-1}
  path-style: ${STOCKAGE_PATH_STYLE:true}
  access-key: ${STOCKAGE_ACCESS_KEY:}
  secret-key: ${STOCKAGE_SECRET_KEY:}
  # false : droits des buckets réglés au déploiement (serveur sans politiques de bucket, ex. Garage)
  gerer-politiques: ${STOCKAGE_GERER_POLITIQUES:true}

# ─── Juridictions (CLAUDE.md §4bis, J2) ───────────────────────────────────────
# Un pays sans profil n'est pas pris en charge. Profil contrôlé au démarrage (JuridictionRegistry) :
# devise-defaut dans devises, champs = noms de BienFormDTO, une RegleJuridiction par pays.
kupanga:
  juridictions:
    FR:
      locale: fr-FR
      fuseau: Europe/Paris
      devises: [EUR]
      devise-defaut: EUR
      champs-obligatoires: [codePostal, depotGarantie]
      # J4 : adresse congolaise sans objet en France ; C12 : dépôt en montant (pas de garantie en mois ni d'avance)
      champs-masques: [commune, quartier, avenue, numeroParcelle, pointDeRepere, garantieMois, avanceMois, heuresElectriciteParJour]
      types-bien: [APPARTEMENT, MAISON, STUDIO]
      modele-documents: fr-v1
      notification:
        canaux: [EMAIL]
      # C8-bis : modes que le propriétaire peut déclarer (aucun paiement ne passe par l'application)
      modes-paiement: [VIREMENT, CHEQUE, ESPECES, AUTRE]
      # C11 / C13
      equipements: [PARKING, CLIMATISATION]
      compteurs-edl: [EAU_FROIDE, EAU_CHAUDE, ELECTRICITE, ELECTRICITE_HP, ELECTRICITE_HC, GAZ]
    CD:
      locale: fr-CD
      # MVP Kinshasa (UTC+1) ; Lubumbashi est en UTC+2
      fuseau: Africa/Kinshasa
      devises: [USD, CDF]
      devise-defaut: USD
      # J4 (C1) : on situe un logement par sa commune et son quartier (« Q/Matonge, C/Kalamu »)
      # C12 : garantie en mois de loyer et loyers payés d'avance (en mois), deux champs distincts
      champs-obligatoires: [commune, quartier, garantieMois, avanceMois]
      # Pas de code postal en usage, ni de diagnostic de performance énergétique en RDC ; garantie en mois (C12)
      champs-masques: [codePostal, classeEnergie, classeGes, depotGarantie]
      # C10
      types-bien: [APPARTEMENT, MAISON, STUDIO, VILLA, ANNEXE, CHAMBRE, LOCAL_COMMERCIAL, ENTREPOT, PARCELLE, TERRAIN]
      modele-documents: cd-v1
      notification:
        canaux: [EMAIL, WHATSAPP_LIEN]
      modes-paiement: [ESPECES, MOBILE_MONEY, VIREMENT, AUTRE]
      # C11 / C13 : eau, électricité (SNEL, groupe, solaire), sécurité ; compteurs prépayés et groupe électrogène
      equipements: [EAU_REGIDESO, FORAGE, CITERNE, ELECTRICITE_SNEL, GROUPE_ELECTROGENE, PANNEAUX_SOLAIRES, CLOTURE, GARDIENNAGE, PARKING, CLIMATISATION]
      compteurs-edl: [EAU_FROIDE, ELECTRICITE, CASH_POWER, GROUPE_ELECTROGENE]
  # C5 : montants maximaux par devise (au-delà : 400). CDF ≈ 100 000 USD au taux d'environ 2 800 CDF pour 1 USD.
  plafonds:
    EUR: { loyer-mensuel: 100000, charges-mensuelles: 10000, depot-garantie: 100000 }
    USD: { loyer-mensuel: 100000, charges-mensuelles: 10000, depot-garantie: 100000 }
    CDF: { loyer-mensuel: 300000000, charges-mensuelles: 30000000, depot-garantie: 300000000 }

app:
  feature-flags:
    newFeature: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-time: 300000

google:
  client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}