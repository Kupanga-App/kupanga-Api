spring:
  application:
    name: kupanga
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env.dev[.properties]

  websocket:
    allowed-origins: "http://localhost:4200 , https://kupanga.lespacelibellule.com"

server:
  port: ${PORT:8089}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

brevo:
  api-key: ${BREVO_API_KEY:test-api-key}
  sender-email: ${BREVO_SENDER_EMAIL:noreplydevback@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:Kupanga}

app:
  feature-flags:
    newFeature: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-time: 300000

google:
  client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

logging:
  level:
    com.kupanga.api.chat.controller: DEBUG