spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # D6 : une migration modifiée après coup est refusée au démarrage. Base existante : V1, V24 et V27 ont été
    # modifiées après leur passage → lancer une fois `flyway repair` avant ce déploiement (docs/sauvegardes.md).
    validate-on-migrate: true
    default-schema: public

  # Upstash Redis — connexion binaire TLS via URL (rediss://)
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms
  cache:
    type: redis
  lifecycle:
    timeout-per-shutdown-phase: 30s

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}

app:
  url: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kupanga.lespacelibellule.com}
  reset-link: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/reset-password?token=
  url-login: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/login
  url-mino: ${MINIO_PUBLIC_URL:https://minio-backend.duckdns.org}
  cookie:
    secure: true
    same-site: None

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      # /actuator/health est public (P0-1) : ne jamais exposer l'état de la BDD, Redis, MinIO…
      show-details: never

sentry:
  dsn: ${SENTRY_DSN}
  # false : Sentry n'envoie ni cookies (refresh token), ni en-têtes sensibles (Authorization: Bearer <JWT>),
  # ni l'IP ou l'utilisateur. Ne jamais repasser à true (données personnelles + jetons de session).
  # cf. https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/
  send-default-pii: false
  # D5 : 10 % des transactions tracées (coût et volume) ; les erreurs, elles, sont toutes envoyées
  traces-sample-rate: 0.1

# Swagger désactivé en production (décision P0-1)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# IP réelle du client derrière le reverse proxy (X-Forwarded-For lu par Tomcat RemoteIpValve,
# seulement depuis des proxys internes) : utilisée par la limite de tentatives (A3)
server:
  forward-headers-strategy: native
  # Arrêt propre (B11, D2) : les requêtes en cours se terminent et l'exécuteur des e-mails vide sa file
  shutdown: graceful

