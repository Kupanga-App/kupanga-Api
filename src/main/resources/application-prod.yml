spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    default-schema: public

  # Upstash Redis — connexion binaire TLS via URL (rediss://)
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms
  cache:
    type: redis

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}

app:
  url: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}
  reset-link: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/reset-password?token=
  url-login: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/login
  url-mino: ${MINIO_PUBLIC_URL:http://158.178.215.62:9000}
  cookie:
    secure: true
    same-site: None

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
