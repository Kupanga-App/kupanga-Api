spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    default-schema: public

  # Upstash Redis — connexion binaire TLS via URL (rediss://)
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms
  cache:
    type: redis

  mail:
    host: smtp-relay.brevo.com
    port: 465
    username: ${BREVO_USERNAME}
    password: ${BREVO_SMTP_KEY}

    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}

app:
  url: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}
  reset-link: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/reset-password?token=
  url-login: ${FRONTEND_URL:https://kupanga.lespacelibellule.com/}auth/login
  url-mino: ${MINIO_PUBLIC_URL:https://minio-backend.duckdns.org}
  cookie:
    secure: true
    same-site: None

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

sentry:
  dsn: ${SENTRY_DSN}
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0
