spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/kupanga_test
    username: kupanga
    password: testpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        hbm2ddl:
          ddl-auto: create-drop
        format_sql: true
  flyway:
    enabled: false
  cache:
    type: none

  # M1 : aucun serveur SMTP en test (les envois passent par des doubles ou GreenMail)
  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

email:
  expediteur: noreply@kupanga.test
  # M2 : ni envoi ni purge en arrière-plan (les tests appellent l'envoyeur eux-mêmes)
  envoi:
    actif: false
stockage:
  endpoint: http://localhost:9000
  url-publique: http://localhost:9000
  access-key: kupanga-dev
  secret-key: kupanga-dev-secret

app:
  url: http://localhost:4200/
  cors:
    allowed-origins: http://localhost:4200
  rate-limit:
    stockage: memoire   # pas de Redis en test / CI
  juridictions:
    verifier-biens-au-demarrage: false   # base partagée sans Flyway (JuridictionConfig)
  reset-link: http://localhost:4200/auth/reset-password?token=
  url-login: http://localhost:4200/auth/login
  cookie:
    secure: false
    same-site: Lax

ADMIN_EMAIL: test-admin@kupanga.test
ADMIN_PASSWORD: test-admin-password