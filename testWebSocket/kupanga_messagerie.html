<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kupanga — Messagerie</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <style>
        :root {
            --bg:         #0d0f14;
            --surface:    #151820;
            --surface2:   #1c2030;
            --border:     #252a3a;
            --accent:     #4f6ef7;
            --accent2:    #7c3aed;
            --success:    #22c55e;
            --danger:     #ef4444;
            --warning:    #f59e0b;
            --text:       #e8eaf0;
            --text-muted: #6b7280;
            --bubble-out: #4f6ef7;
            --bubble-in:  #1c2030;
            --radius:     14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ══ LOGIN ═══════════════════════════════════════════════════════════════ */
        #loginScreen {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, rgba(79,110,247,.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(124,58,237,.08) 0%, transparent 55%),
                        var(--bg);
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 40px;
            width: 380px;
            display: flex; flex-direction: column; gap: 18px;
        }

        .login-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .login-sub  { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; margin-top: -12px; }

        .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .field input  { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 10px 14px; outline: none; transition: border-color .2s; }
        .field input:focus { border-color: var(--accent); }

        .login-error { font-size: 12px; color: var(--danger); min-height: 16px; padding: 0 2px; }

        .btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .15s; }
        .btn-primary:hover   { opacity: .88; transform: translateY(-1px); }
        .btn-primary:active  { transform: translateY(0); }
        .btn-primary:disabled { opacity: .38; cursor: not-allowed; transform: none; }

        .login-spinner { display: none; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
        .login-spinner.visible { display: flex; }
        .spin { width: 16px; height: 16px; border: 2px solid rgba(79,110,247,.25); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ══ APP ═════════════════════════════════════════════════════════════════ */
        #appScreen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        #appScreen.visible { display: flex; }

        /* Topbar */
        .topbar {
            height: 56px; background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; flex-shrink: 0; gap: 16px;
        }

        .topbar-logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .topbar-user-name { font-size: 13px; font-weight: 500; color: var(--text-muted); }

        .notif-btn {
            position: relative; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; padding: 7px 12px; cursor: pointer;
            font-size: 16px; line-height: 1; color: var(--text);
            transition: background .15s, border-color .15s;
        }
        .notif-btn:hover { background: var(--border); border-color: var(--accent); }

        .notif-badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
            border-radius: 10px; padding: 2px 6px; min-width: 18px; text-align: center;
            border: 2px solid var(--surface);
            display: none;
        }
        .notif-badge.visible { display: block; }

        .btn-logout { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 14px; cursor: pointer; transition: border-color .2s, color .2s; }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        /* Notification panel */
        .notif-panel {
            position: fixed; top: 64px; right: 16px; z-index: 200;
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            width: 320px; max-height: 400px; overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0,0,0,.5);
            display: none;
        }
        .notif-panel.visible { display: block; }
        .notif-panel-header { padding: 14px 18px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .notif-panel-header button { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-decoration: underline; }
        .notif-item { padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: var(--surface2); }
        .notif-item-from { font-size: 12px; font-weight: 600; color: var(--accent); }
        .notif-item-text { font-size: 13px; color: var(--text); margin-top: 2px; }
        .notif-item-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .notif-empty { padding: 24px 18px; text-align: center; color: var(--text-muted); font-size: 13px; }

        /* App body */
        .app-body { flex: 1; display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }

        /* ══ SIDEBAR ═════════════════════════════════════════════════════════════ */
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

        .sidebar-controls { padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }

        .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; transition: border-color .2s; }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }

        .filters { display: flex; gap: 6px; align-items: center; }
        .filter-select { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 8px; outline: none; cursor: pointer; }
        .filter-select:focus { border-color: var(--accent); }
        .sort-dir-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 14px; padding: 6px 10px; cursor: pointer; transition: background .15s, color .15s; flex-shrink: 0; }
        .sort-dir-btn:hover { background: var(--border); color: var(--accent); }

        .conv-list { flex: 1; overflow-y: auto; }
        .conv-list::-webkit-scrollbar { width: 3px; }
        .conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .conv-empty { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
        .conv-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 32px 16px; color: var(--text-muted); font-size: 13px; }

        .conv-item {
            display: flex; gap: 12px; padding: 13px 16px; cursor: pointer;
            border-bottom: 1px solid var(--border); transition: background .15s;
            position: relative;
        }
        .conv-item:hover { background: var(--surface2); }
        .conv-item.active { background: rgba(79,110,247,.1); border-right: 2px solid var(--accent); }

        .conv-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0;
            position: relative;
        }

        .conv-unread-badge {
            position: absolute; top: -3px; right: -3px;
            background: var(--danger); color: #fff; font-size: 9px; font-weight: 700;
            border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center;
            border: 2px solid var(--surface);
            display: none;
        }
        .conv-unread-badge.visible { display: block; }

        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-bien { font-size: 11px; color: var(--accent); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last  { font-size: 12px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-time  { font-size: 10px; color: var(--text-muted); flex-shrink: 0; align-self: flex-start; padding-top: 2px; }

        .pagination-bar { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .page-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 14px; padding: 4px 10px; cursor: pointer; transition: background .15s; }
        .page-btn:hover:not(:disabled) { background: var(--border); color: var(--text); }
        .page-btn:disabled { opacity: .3; cursor: not-allowed; }
        .page-info { font-size: 11px; color: var(--text-muted); }

        /* ══ CHAT AREA ═══════════════════════════════════════════════════════════ */
        .chat-area { display: flex; flex-direction: column; overflow: hidden; position: relative; }

        .no-conv-state {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: var(--text-muted);
        }
        .no-conv-icon { font-size: 52px; opacity: .2; }
        .no-conv-state p { font-size: 13px; text-align: center; line-height: 1.7; max-width: 240px; }

        .active-conv { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .chat-header {
            padding: 14px 24px; border-bottom: 1px solid var(--border);
            background: var(--surface); display: flex; align-items: center;
            justify-content: space-between; flex-shrink: 0;
        }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
        .chat-contact-name { font-weight: 600; font-size: 14px; }
        .chat-contact-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .chat-bien-pill    { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--text-muted); }
        .chat-bien-pill span { color: var(--accent); font-weight: 600; }

        .messages { flex: 1; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 12px; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .msg-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 20px; color: var(--text-muted); font-size: 13px; }

        .date-chip { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
        .date-chip::before,.date-chip::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .msg-row { display: flex; flex-direction: column; animation: slideIn .2s ease; }
        @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .msg-row.outgoing { align-items: flex-end; }
        .msg-row.incoming { align-items: flex-start; }

        .msg-bubble { max-width: 68%; padding: 10px 15px; border-radius: var(--radius); font-size: 14px; line-height: 1.5; word-break: break-word; }
        .msg-row.outgoing .msg-bubble { background: var(--bubble-out); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.incoming .msg-bubble { background: var(--bubble-in); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
        .msg-row.incoming.new .msg-bubble { border-color: rgba(79,110,247,.4); box-shadow: 0 0 12px rgba(79,110,247,.1); }
        .msg-row.system .msg-bubble { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); font-size: 11px; font-style: italic; max-width: 100%; text-align: center; align-self: center; }
        .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; padding: 0 2px; }

        .typing-row { display: none; align-items: center; gap: 8px; padding: 0 24px 8px; flex-shrink: 0; }
        .typing-row.visible { display: flex; }
        .typing-bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; border-bottom-left-radius: 4px; padding: 10px 14px; display: flex; gap: 4px; align-items: center; }
        .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: typeBounce 1.2s infinite; }
        .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes typeBounce { 0%,80%,100%{transform:scale(.7);opacity:.5} 40%{transform:scale(1.1);opacity:1} }

        .input-area { padding: 12px 24px 16px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
        .input-wrap { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 13px; transition: border-color .2s; }
        .input-wrap:focus-within { border-color: var(--accent); }
        #msgInput { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; max-height: 110px; line-height: 1.5; }
        #msgInput::placeholder { color: var(--text-muted); }
        .btn-send { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .2s, transform .15s; flex-shrink: 0; }
        .btn-send:hover   { opacity: .85; transform: translateY(-1px); }
        .btn-send:active  { transform: translateY(0); }
        .btn-send:disabled { opacity: .28; cursor: not-allowed; transform: none; }
        .btn-send svg { width: 17px; height: 17px; fill: #fff; }

        /* ══ TOAST ═══════════════════════════════════════════════════════════════ */
        .toast {
            position: fixed; top: 68px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--surface); border: 1px solid var(--accent); border-radius: 12px;
            padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,.4); z-index: 300;
            opacity: 0; transition: transform .3s ease, opacity .3s ease;
            max-width: 420px; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-icon { font-size: 18px; flex-shrink: 0; }
        .toast-body { flex: 1; min-width: 0; }
        .toast-from { font-size: 11px; color: var(--accent); font-weight: 600; }
        .toast-text { font-size: 13px; color: var(--text); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; flex-shrink: 0; }

        /* WS status dot (bas de la topbar) */
        .ws-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
        .ws-dot.connected    { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .ws-dot.connecting   { background: var(--warning); animation: pulse 1s infinite; }
        .ws-dot.disconnected { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .ws-label { font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>

<!-- ══ LOGIN ═══════════════════════════════════════════════════════════════════ -->
<div id="loginScreen">
    <div class="login-card">
        <div>
            <div class="login-logo">Kupanga</div>
            <div class="login-sub">Messagerie</div>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="vous@example.com" autocomplete="email">
        </div>
        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="login-error" id="loginError"></div>
        <div class="login-spinner" id="loginSpinner">
            <div class="spin"></div> Connexion en cours…
        </div>
        <button class="btn-primary" id="btnLogin" onclick="doLogin()">Se connecter</button>
    </div>
</div>

<!-- ══ APP ═════════════════════════════════════════════════════════════════════ -->
<div id="appScreen">

    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-logo">Kupanga</div>
        <div class="topbar-right">
            <div class="ws-dot" id="wsDot"></div>
            <span class="ws-label" id="wsLabel">Non connecté</span>
            <span class="topbar-user-name" id="topbarUser"></span>
            <button class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()" title="Notifications">
                🔔
                <span class="notif-badge" id="notifBadge">0</span>
            </button>
            <button class="btn-logout" onclick="doLogout()">Déconnexion</button>
        </div>
    </div>

    <!-- Notification panel -->
    <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-header">
            <span>Notifications</span>
            <button onclick="clearNotifications()">Tout effacer</button>
        </div>
        <div id="notifList">
            <div class="notif-empty">Aucune nouvelle notification</div>
        </div>
    </div>

    <!-- Main -->
    <div class="app-body">

        <!-- ── SIDEBAR ─────────────────────────────────────────────────────────── -->
        <aside class="sidebar">
            <div class="sidebar-controls">
                <input type="text" class="search-input" id="searchBien"
                       placeholder="🔍 Rechercher par bien…"
                       oninput="onSearchInput()">
                <div class="filters">
                    <select class="filter-select" id="filterLu" onchange="reloadConversations()">
                        <option value="">Toutes</option>
                        <option value="false">Non lues</option>
                        <option value="true">Lues</option>
                    </select>
                    <select class="filter-select" id="sortBy" onchange="reloadConversations()">
                        <option value="lastMessageAt">Dernier msg</option>
                        <option value="createdAt">Date création</option>
                        <option value="id">ID</option>
                    </select>
                    <button class="sort-dir-btn" id="sortDirBtn" onclick="toggleSortDir()" title="Inverser l'ordre">↓</button>
                </div>
            </div>

            <div class="conv-list" id="convList">
                <div class="conv-loading"><div class="spin"></div> Chargement…</div>
            </div>

            <div class="pagination-bar" id="paginationBar">
                <button class="page-btn" id="btnPrev" onclick="prevPage()" disabled>‹</button>
                <span class="page-info" id="pageInfo">Page 1</span>
                <button class="page-btn" id="btnNext" onclick="nextPage()" disabled>›</button>
            </div>
        </aside>

        <!-- ── CHAT AREA ──────────────────────────────────────────────────────── -->
        <main class="chat-area">

            <!-- Empty state -->
            <div class="no-conv-state" id="noConvState">
                <div class="no-conv-icon">💬</div>
                <p>Sélectionne une conversation dans la liste pour commencer à écrire.</p>
            </div>

            <!-- Active conversation -->
            <div class="active-conv" id="activeConv" style="display:none">

                <div class="chat-header">
                    <div class="chat-header-left">
                        <div class="chat-avatar" id="chatAvatar">?</div>
                        <div>
                            <div class="chat-contact-name" id="chatContactName">—</div>
                            <div class="chat-contact-sub" id="chatContactSub">—</div>
                        </div>
                    </div>
                    <div class="chat-bien-pill">Bien <span id="chatBienDisplay">#—</span></div>
                </div>

                <div class="messages" id="messages"></div>

                <div class="typing-row" id="typingRow">
                    <div class="typing-bubble">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-wrap">
                        <textarea id="msgInput" rows="1"
                                  placeholder="Écris un message… (Entrée pour envoyer)"
                                  onkeydown="handleMsgKey(event)"
                                  oninput="autoResize(this)"></textarea>
                    </div>
                    <button class="btn-send" id="btnSend" onclick="sendMessage()" title="Envoyer">
                        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
                    </button>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <div class="toast-icon">💬</div>
    <div class="toast-body">
        <div class="toast-from" id="toastFrom"></div>
        <div class="toast-text" id="toastText"></div>
    </div>
    <button class="toast-close" onclick="hideToast()">×</button>
</div>

<!-- ══ JAVASCRIPT ══════════════════════════════════════════════════════════════ -->
<script>
// ─── Configuration ────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:8089';

// ─── État global ──────────────────────────────────────────────────────────────
let token         = null;
let monEmail      = null;
let monNom        = null;
let stompClient   = null;
let wsConnected   = false;
let convActive    = null;   // ConversationDTO sélectionné
let currentPage   = 0;
let totalPages    = 1;
let sortDir       = 'DESC';
let searchTimer   = null;
let notifCount    = 0;
let notifList     = [];
let toastTimer    = null;

// ─── Helpers HTTP ─────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
        ...opts,
        headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: 'Bearer ' + token } : {}),
            ...(opts.headers || {})
        }
    });
    if (!res.ok) {
        let msg = 'Erreur ' + res.status;
        try { const j = await res.json(); msg = j.message || j.error || msg; } catch {}
        throw new Error(msg);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
}

// ─── Utilitaires ──────────────────────────────────────────────────────────────
function fmtTime(iso) {
    if (!iso) return '';
    try {
        const d = new Date(iso);
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const isYesterday = new Date(now - 86400000).toDateString() === d.toDateString();
        if (isToday)     return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        if (isYesterday) return 'Hier';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    } catch { return ''; }
}

function fmtTimeFull(iso) {
    if (!iso) return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    try { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
    catch { return ''; }
}

function interlocutor(conv) {
    return conv.emailExpediteur === monEmail ? conv.emailDestinataire : conv.emailExpediteur;
}

function initials(email) {
    return (email || '?')[0].toUpperCase();
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

function setWsStatus(cls, label) {
    document.getElementById('wsDot').className   = 'ws-dot ' + cls;
    document.getElementById('wsLabel').textContent = label;
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl    = document.getElementById('loginError');
    errEl.textContent = '';

    if (!email || !password) { errEl.textContent = 'Email et mot de passe requis.'; return; }

    document.getElementById('btnLogin').disabled  = true;
    document.getElementById('loginSpinner').classList.add('visible');

    try {
        const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
        });

        token = data.accessToken;

        const me = await apiFetch('/auth/me');
        monEmail = me.mail;
        monNom   = (me.firstName || '') + ' ' + (me.lastName || '');

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').classList.add('visible');
        document.getElementById('topbarUser').textContent = monNom.trim() || monEmail;

        await initApp();

    } catch (err) {
        errEl.textContent = err.message || 'Identifiants incorrects.';
    } finally {
        document.getElementById('btnLogin').disabled = false;
        document.getElementById('loginSpinner').classList.remove('visible');
    }
}

async function doLogout() {
    try { await apiFetch('/auth/logout', { method: 'POST' }); } catch {}
    if (stompClient) stompClient.deactivate();
    token = null; monEmail = null; wsConnected = false;
    convActive = null;
    document.getElementById('appScreen').classList.remove('visible');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('notifList').innerHTML = '<div class="notif-empty">Aucune nouvelle notification</div>';
    document.getElementById('notifBadge').classList.remove('visible');
    notifCount = 0; notifList = [];
    document.getElementById('appScreen').style.display = '';
}

// ─── INIT APP ─────────────────────────────────────────────────────────────────
async function initApp() {
    await loadConversations();
    connectStomp();
}

// ─── STOMP ────────────────────────────────────────────────────────────────────
function connectStomp() {
    setWsStatus('connecting', 'Connexion…');

    stompClient = new StompJs.Client({
        webSocketFactory : () => new SockJS(API_BASE + '/ws'),
        connectHeaders   : { Authorization: 'Bearer ' + token },

        onConnect: () => {
            wsConnected = true;
            setWsStatus('connected', 'Connecté');

            // ─ Messages temps réel (conversation active) ─
            stompClient.subscribe('/user/' + monEmail + '/queue/messages', handleIncomingMessage);
            stompClient.subscribe('/user/queue/messages', handleIncomingMessage);

            // ─ Notifications globales ─
            stompClient.subscribe('/user/' + monEmail + '/queue/notifications', handleNotification);
            stompClient.subscribe('/user/queue/notifications', handleNotification);
        },

        onStompError:    f  => { wsConnected = false; setWsStatus('disconnected', 'Erreur STOMP'); },
        onDisconnect:    () => { wsConnected = false; setWsStatus('disconnected', 'Déconnecté'); },
        onWebSocketError: e => { wsConnected = false; setWsStatus('disconnected', 'Erreur WS'); },
        debug: () => {}
    });

    stompClient.activate();
}

// ─── HANDLER MESSAGES ENTRANTS ────────────────────────────────────────────────
// Déduplication pour éviter le double push (abonnement x2)
const seenMessages = new Set();

function handleIncomingMessage(frame) {
    try {
        const data = JSON.parse(frame.body);
        const msgId = data.id;

        if (msgId && seenMessages.has(msgId)) return;
        if (msgId) seenMessages.add(msgId);

        const from    = data.expediteurEmail || 'Interlocuteur';
        const contenu = data.contenu || data.content || JSON.stringify(data);
        const convId  = data.conversationId || null;

        // Si on est dans la bonne conversation → afficher en temps réel
        if (convActive && from !== monEmail) {
            const interEmail = interlocutor(convActive);
            if (from === interEmail) {
                addMessageBubble(contenu, 'incoming', from, data.createdAt, true);
                // Marquer comme lu immédiatement
                markAsRead(from);
                return; // pas de badge ni toast, on est déjà dans la conversation
            }
        }

        // Sinon → incrémenter badge dans la sidebar si on connaît la conv
        if (convId) incrementConvBadge(convId);

    } catch (e) { console.error('[MSG] Parse error', e); }
}

// ─── HANDLER NOTIFICATIONS GLOBALES ──────────────────────────────────────────
const seenNotifs = new Set();

function handleNotification(frame) {
    try {
        const notif = JSON.parse(frame.body);
        const convId = notif.conversationId;
        const key = convId + '_' + notif.createdAt;

        if (seenNotifs.has(key)) return;
        seenNotifs.add(key);

        // Si on est dans cette conversation, ignorer la notif
        if (convActive && convActive.id === convId) return;

        notifCount++;
        notifList.unshift(notif);

        updateNotifBadge();
        showToast(notif.expediteurNom || notif.expediteurEmail, notif.contenuPreview);
        incrementConvBadge(convId);

    } catch (e) { console.error('[NOTIF] Parse error', e); }
}

function updateNotifBadge() {
    const badge = document.getElementById('notifBadge');
    badge.textContent = notifCount;
    badge.classList.toggle('visible', notifCount > 0);
}

function incrementConvBadge(convId) {
    const el = document.querySelector(`.conv-item[data-id="${convId}"] .conv-unread-badge`);
    if (!el) return;
    const current = parseInt(el.textContent || '0', 10);
    el.textContent = current + 1;
    el.classList.add('visible');
}

// ─── PANEL NOTIFICATIONS ──────────────────────────────────────────────────────
function toggleNotifPanel() {
    document.getElementById('notifPanel').classList.toggle('visible');
    if (document.getElementById('notifPanel').classList.contains('visible')) {
        renderNotifPanel();
    }
}

function renderNotifPanel() {
    const list = document.getElementById('notifList');
    if (notifList.length === 0) {
        list.innerHTML = '<div class="notif-empty">Aucune nouvelle notification</div>';
        return;
    }
    list.innerHTML = notifList.map((n, i) => `
        <div class="notif-item" onclick="goToNotifConv(${n.conversationId})">
            <div class="notif-item-from">${escHtml(n.expediteurNom || n.expediteurEmail)}</div>
            <div class="notif-item-text">${escHtml(n.contenuPreview)}</div>
            <div class="notif-item-time">${fmtTimeFull(n.createdAt)}</div>
        </div>
    `).join('');
}

function clearNotifications() {
    notifList = []; notifCount = 0;
    updateNotifBadge();
    document.getElementById('notifList').innerHTML = '<div class="notif-empty">Aucune nouvelle notification</div>';
}

function goToNotifConv(convId) {
    document.getElementById('notifPanel').classList.remove('visible');
    const item = document.querySelector(`.conv-item[data-id="${convId}"]`);
    if (item) item.click();
}

// Close panel on outside click
document.addEventListener('click', e => {
    const panel = document.getElementById('notifPanel');
    const btn   = document.getElementById('notifBtn');
    if (panel.classList.contains('visible') && !panel.contains(e.target) && !btn.contains(e.target)) {
        panel.classList.remove('visible');
    }
});

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(from, text) {
    document.getElementById('toastFrom').textContent = from;
    document.getElementById('toastText').textContent = text;
    document.getElementById('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4500);
}

function hideToast() {
    document.getElementById('toast').classList.remove('show');
}

// ─── CONVERSATIONS ────────────────────────────────────────────────────────────
async function loadConversations(page = 0) {
    currentPage = page;
    const bien    = document.getElementById('searchBien').value.trim() || null;
    const luVal   = document.getElementById('filterLu').value;
    const sortByV = document.getElementById('sortBy').value;

    const body = {
        nomDuBien     : bien || null,
        lu            : luVal === '' ? null : luVal === 'true',
        page          : currentPage,
        size          : 12,
        sortBy        : sortByV,
        sortDirection : sortDir
    };

    const list = document.getElementById('convList');
    list.innerHTML = '<div class="conv-loading"><div class="spin"></div> Chargement…</div>';

    try {
        const data = await apiFetch('/conversations/search', { method: 'POST', body: JSON.stringify(body) });
        totalPages = data.totalPages || 1;
        renderConversations(data.contenu || []);
        renderPagination(data);
    } catch (err) {
        list.innerHTML = `<div class="conv-empty">Erreur : ${escHtml(err.message)}</div>`;
    }
}

function reloadConversations() {
    loadConversations(0);
}

function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadConversations(0), 400);
}

function toggleSortDir() {
    sortDir = sortDir === 'DESC' ? 'ASC' : 'DESC';
    document.getElementById('sortDirBtn').textContent = sortDir === 'DESC' ? '↓' : '↑';
    loadConversations(0);
}

function prevPage() { if (currentPage > 0) loadConversations(currentPage - 1); }
function nextPage() { if (currentPage < totalPages - 1) loadConversations(currentPage + 1); }

function renderPagination(data) {
    document.getElementById('pageInfo').textContent  = `Page ${data.pageActuelle + 1} / ${Math.max(data.totalPages, 1)}`;
    document.getElementById('btnPrev').disabled = data.premierePage;
    document.getElementById('btnNext').disabled = data.dernierePage;
}

function renderConversations(convs) {
    const list = document.getElementById('convList');
    if (convs.length === 0) {
        list.innerHTML = '<div class="conv-empty">Aucune conversation trouvée.</div>';
        return;
    }

    list.innerHTML = convs.map(conv => {
        const other   = interlocutor(conv);
        const init    = initials(other);
        const preview = conv.lastMessage ? escHtml(conv.lastMessage.substring(0, 45)) + (conv.lastMessage.length > 45 ? '…' : '') : '<i>Nouvelle conversation</i>';
        const time    = fmtTime(conv.lastMessageAt);
        const unread  = conv.nonLuCount > 0;
        const isActive = convActive && convActive.id === conv.id;

        return `
        <div class="conv-item${isActive ? ' active' : ''}" data-id="${conv.id}" onclick="openConversation(${conv.id})">
            <div class="conv-avatar">
                ${init}
                <span class="conv-unread-badge${unread ? ' visible' : ''}">${unread ? conv.nonLuCount : ''}</span>
            </div>
            <div class="conv-info">
                <div class="conv-name">${escHtml(other)}</div>
                <div class="conv-bien">${escHtml(conv.bienTitre || 'Bien #' + conv.bienId)}</div>
                <div class="conv-last">${preview}</div>
            </div>
            <span class="conv-time">${time}</span>
        </div>`;
    }).join('');

    // Stocker les données des conversations pour openConversation
    window._convData = Object.fromEntries(convs.map(c => [c.id, c]));
}

// ─── OUVRIR UNE CONVERSATION ──────────────────────────────────────────────────
async function openConversation(convId) {
    const conv = window._convData && window._convData[convId];
    if (!conv) return;

    convActive = conv;

    // Highlight item actif
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    const item = document.querySelector(`.conv-item[data-id="${convId}"]`);
    if (item) {
        item.classList.add('active');
        // Reset badge
        const badge = item.querySelector('.conv-unread-badge');
        if (badge) { badge.textContent = ''; badge.classList.remove('visible'); }
    }

    const other = interlocutor(conv);

    document.getElementById('noConvState').style.display = 'none';
    document.getElementById('activeConv').style.display  = 'flex';
    document.getElementById('chatAvatar').textContent      = initials(other);
    document.getElementById('chatContactName').textContent = other;
    document.getElementById('chatContactSub').textContent  = escHtml(conv.bienTitre || 'Bien #' + conv.bienId);
    document.getElementById('chatBienDisplay').textContent = '#' + conv.bienId;

    document.getElementById('messages').innerHTML = '<div class="msg-loading"><div class="spin"></div> Chargement…</div>';

    try {
        const msgs = await apiFetch(`/historique?bienId=${conv.bienId}&emailInterlocuteur=${encodeURIComponent(other)}`);
        renderHistory(msgs, other);
        await markAsRead(other);
    } catch (err) {
        document.getElementById('messages').innerHTML = `<div class="msg-loading">Erreur : ${escHtml(err.message)}</div>`;
    }
}

function renderHistory(msgs, interlocEmail) {
    const box = document.getElementById('messages');
    box.innerHTML = '';

    if (!msgs || msgs.length === 0) {
        addMessageBubble('Aucun message — soyez les premiers à écrire !', 'system');
        return;
    }

    let lastDate = null;
    msgs.forEach(m => {
        const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString('fr-FR') : null;
        if (dateStr && dateStr !== lastDate) {
            addSeparator(dateStr === new Date().toLocaleDateString('fr-FR') ? 'Aujourd\'hui' :
                         dateStr === new Date(Date.now() - 86400000).toLocaleDateString('fr-FR') ? 'Hier' : dateStr);
            lastDate = dateStr;
        }
        const dir = m.expediteurEmail === monEmail ? 'outgoing' : 'incoming';
        addMessageBubble(m.contenu, dir, m.expediteurEmail, m.createdAt, false);
    });

    addSeparator('— Temps réel —');
    document.getElementById('messages').scrollTop = 99999;
}

function addMessageBubble(contenu, direction, senderEmail = null, timeIso = null, isNew = false) {
    const box = document.getElementById('messages');
    const t   = timeIso ? fmtTimeFull(timeIso) : new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    const row = document.createElement('div');
    row.className = 'msg-row ' + direction + (isNew && direction === 'incoming' ? ' new' : '');

    const bubble = document.createElement('div');
    bubble.className   = 'msg-bubble';
    bubble.textContent = contenu;
    row.appendChild(bubble);

    if (direction !== 'system') {
        const tEl = document.createElement('div');
        tEl.className   = 'msg-time';
        tEl.textContent = t;
        row.appendChild(tEl);
    }

    box.appendChild(row);
    box.scrollTop = box.scrollHeight;

    if (isNew && direction === 'incoming') {
        setTimeout(() => row.classList.remove('new'), 3000);
    }
}

function addSeparator(label) {
    const box = document.getElementById('messages');
    const sep = document.createElement('div');
    sep.className   = 'date-chip';
    sep.textContent = label;
    box.appendChild(sep);
}

// ─── MARQUER COMME LU ─────────────────────────────────────────────────────────
async function markAsRead(interlocEmail) {
    try {
        await apiFetch(`/messages/conversation/${encodeURIComponent(interlocEmail)}/lire`, { method: 'POST' });
    } catch {}
}

// ─── ENVOYER UN MESSAGE ───────────────────────────────────────────────────────
function handleMsgKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendMessage() {
    const input   = document.getElementById('msgInput');
    const contenu = input.value.trim();

    if (!contenu) return;
    if (!convActive) { alert('Aucune conversation sélectionnée.'); return; }
    if (!wsConnected) { alert('WebSocket non connecté.'); return; }

    const other = interlocutor(convActive);

    stompClient.publish({
        destination : '/app/chat.send',
        body        : JSON.stringify({
            contenu,
            emailDestinataire : other,
            bienId            : convActive.bienId
        })
    });

    addMessageBubble(contenu, 'outgoing', monEmail);

    input.value = '';
    input.style.height = 'auto';
}

// ─── SÉCURITÉ XSS ─────────────────────────────────────────────────────────────
function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
